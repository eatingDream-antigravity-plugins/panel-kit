[package]
name = "agy-mcp-kit"
version = "0.4.1"
edition = "2021"
rust-version = "1.75"
description = "Zero-bloat Rust MCP runtime primitives, dark-first panel kit, and drift-checked vendor sync for Antigravity plugins"
license = "MIT"
repository = "https://github.com/eatingDream-antigravity-plugins/panel-kit"
homepage = "https://github.com/eatingDream-antigravity-plugins/panel-kit"
keywords = ["mcp", "jsonrpc", "sep-1865", "swr", "antigravity"]
categories = ["development-tools", "network-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
